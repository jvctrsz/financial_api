services:
  postgres:
    image: postgres:16
    container_name: financial-api-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - financial_postgres_data:/var/lib/postgresql/data

  api:
    build: .
    restart: unless-stopped
    ports:
      - "5000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    env_file:
      - ./.env
    depends_on:
      - postgres

volumes:
  financial_postgres_data: